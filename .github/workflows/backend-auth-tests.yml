name: Continuous integration

on:
  push:
    branches:
      - main
      - development
      - "feature/**"
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pv_vault_test
          POSTGRES_USER: pv_vault_test
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pv_vault_test -d pv_vault_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PV_TEST_DATABASE_URL: >-
        postgresql://pv_vault_test:test-password@localhost:5432/pv_vault_test
      PV_ENVIRONMENT: test
      PV_COMMIT: test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend and architecture tests
        run: python -m pytest -q

  frontend:
    name: Frontend / Bun
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PV_ENVIRONMENT: test
      PV_COMMIT: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint frontend
        run: bun run lint
      - name: Test frontend helpers
        run: bun test tests
      - name: Build frontend
        run: bun run build
